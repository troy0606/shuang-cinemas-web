services:
  # ── 前台 ─────────────────────────────────────────────
  - type: web
    name: shuang-cinemas-web
    runtime: static
    buildCommand: >-
      npm install -g pnpm@11.18.0 &&
      pnpm install --frozen-lockfile &&
      pnpm build:front
    staticPublishPath: ./dist/front-stage
    buildFilter:
      paths:
        - apps/front-stage/**
        - libs/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
    pullRequestPreviewsEnabled: true # optional
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── 後台 ─────────────────────────────────────────────
  - type: web
    name: shuang-cinemas-admin
    runtime: static
    buildCommand: >-
      npm install -g pnpm@11.18.0 &&
      pnpm install --frozen-lockfile &&
      pnpm build:back
    staticPublishPath: ./dist/back-stage
    buildFilter:
      paths:
        - apps/back-stage/**
        - libs/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
    pullRequestPreviewsEnabled: true # optional
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
